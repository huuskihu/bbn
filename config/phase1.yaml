# 阶段 1：Pong + 静态闭环（无可塑性）
# Tier 0 与 config/cell_pospischil_rs.yaml 对齐；Tier 1 是阶段 1 的校准参数。

cell:
  C_m_pF: 290.0
  g_L_nS: 29.0
  E_L_mV: -70.0
  g_Na_nS: 14500.0
  E_Na_mV: 50.0
  g_K_nS: 1450.0
  E_K_mV: -100.0
  g_M_nS: 20.3
  V_T_mV: -55.0
  tau_max_ms: 1000.0
  dt_ms: 0.01

phase1:
  tick_ms: 10.0
  duration_s: 120.0

  readout_window_ms: 300.0
  rate_smoothing: 0.2
  reference_rate_hz: 20.0
  velocity_gain: 0.15
  max_velocity: 4.0

  rate_min_hz: 4.0
  rate_max_hz: 40.0
  place_sigma_bins: 1.0
  syn_weight_nS: 40.0
  syn_weight_jitter: 0.4
  syn_tau_ms: 5.0
  E_syn_mV: 0.0

  predictable_rate_hz: 100.0
  predictable_duration_ms: 100.0
  predictable_weight_nS: 5.0
  unpredictable_rate_hz: 5.0
  unpredictable_duration_s: 4.0
  unpredictable_weight_nS: 60.0
  rest_after_miss_s: 4.0

pong:
  ball_speed: 0.5
  paddle_bins: 8.0
  hit_tolerance: 0.5
  y_min: 1.0
  y_max: 8.0
  initial_paddle_y: 4.5

experiment:
  conditions:
    - full_feedback
    - no_feedback
    - silent
    - random_paddle
    - always_up
    - always_down
  seeds: [0, 1, 2]
