stdp:
  a_plus: 0.01
  a_minus: 0.012
  tau_plus_ms: 20.0
  tau_minus_ms: 20.0
  w_min: 0.0
  w_max: 1.0
  w_init: 0.5

eligibility:
  tau_e_ms: 1000.0
  eta: 1.0          # 仅用于验证；Phase 3 会重新设定
