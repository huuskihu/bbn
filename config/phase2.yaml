  measure_window_s: 1.0
  initial_drive_high_nS: 25.0
  initial_drive_low_nS: 3.0

cell:
  C_m_pF: 290.0
  g_L_nS: 29.0
  E_L_mV: -70.0
  g_Na_nS: 14500.0
